<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGuru Mapel - Aplikasi Guru</title>
  
  <!-- Font & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fdf2f8;
    }

    /* Container Fullscreen Wrapper */
    .app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background: #ffffff;
    }

    .app-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading Screen Tema Pink */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #fff1f2 0%, #fce7f3 50%, #fbcfe8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .card-loader {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(251, 207, 232, 0.8);
      padding: 32px 40px;
      border-radius: 24px;
      box-shadow: 0 20px 30px -10px rgba(236, 72, 153, 0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: #fbcfe8;
      color: #9d174d;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-radius: 9999px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #fbcfe8;
      border-bottom-color: #ec4899;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-title {
      font-size: 16px;
      font-weight: 800;
      color: #831843;
      letter-spacing: -0.3px;
    }

    .loading-sub {
      font-size: 12px;
      color: #9d174d;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Overlay Loading Tema Pink -->
    <div id="app-loader" class="loading-overlay">
      <div class="card-loader">
        <div class="brand-badge">
          <i class="fa-solid fa-heart"></i> EDUGURU MAPEL
        </div>

        <div class="spinner"></div>

        <div>
          <h2 class="loading-title">Memuat Aplikasi Guru...</h2>
          <p class="loading-sub">Menghubungkan ke Google Apps Script Database</p>
        </div>
      </div>
    </div>

    <!-- Frame Web App Google Apps Script -->
    <iframe 
      id="gas-frame"
      src="https://script.google.com/macros/s/AKfycbzZTN7ClrzM7L8MFdGTN74vkJUbh4HgdyL9751a_fGmRS_fwVNBs2w6h5MpiNmwLhkEoA/exec" 
      allow="geolocation; microphone; camera; clipboard-write;"
      onload="hideAppLoader()">
    </iframe>
  </div>

  <script>
    function hideAppLoader() {
      const loader = document.getElementById('app-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.visibility = 'hidden';
          loader.style.display = 'none';
        }, 500);
      }
    }
  </script>

</body>
</html>
